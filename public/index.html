<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>F1 PRO - RACE LOBBY</title>
    <style>
        :root {
            --f1-red: #e10600;
            --f1-black: #15151e;
            --f1-dark-gray: #38383f;
            --f1-white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #000;
            color: var(--f1-white);
            font-family: 'Titillium Web', 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* HEADER ESTILO F1 */
        header {
            width: 100%;
            background: var(--f1-black);
            padding: 20px;
            border-bottom: 5px solid var(--f1-red);
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .logo {
            font-weight: 900;
            font-style: italic;
            font-size: 24px;
            letter-spacing: -1px;
        }

        .logo span { color: var(--f1-red); }

        /* CONTENEDOR PRINCIPAL */
        main {
            width: 90%;
            max-width: 600px;
            margin-top: 30px;
        }

        .section-title {
            font-size: 14px;
            text-transform: uppercase;
            color: var(--f1-dark-gray);
            margin-bottom: 15px;
            letter-spacing: 2px;
            border-left: 3px solid var(--f1-red);
            padding-left: 10px;
        }

        /* LISTADO DE SALAS (Inyectado por TS) */
        #room-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* CARD DE SALA */
        .room-card {
            background: var(--f1-black);
            border: 1px solid #222;
            padding: 20px;
            position: relative;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .room-card:hover {
            border-color: var(--f1-red);
            transform: translateX(5px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .room-name {
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 2px;
            font-weight: 800;
        }
		.status-disabled { background: #444; color: #888; }
        .status-waiting { background: #00ff00; color: #000; }
        .status-racing { background: var(--f1-red); color: #fff; }

        .room-details {
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 13px;
            color: #aaa;
        }

        .join-btn {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--f1-white);
            color: var(--f1-white);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .room-card:hover .join-btn {
            background: var(--f1-white);
            color: #000;
        }

        /* FOOTER DE ESTADO */
        footer {
            margin-top: auto;
            padding: 20px;
            font-size: 10px;
            color: var(--f1-dark-gray);
            text-transform: uppercase;
        }

        /* ANIMACIÓN DE CARGA */
        .loading {
            text-align: center;
            padding: 40px;
            font-style: italic;
            color: var(--f1-dark-gray);
        }
		/* MODAL OVERLAY */
    #device-modal {
        display: flex; /* Oculto por defecto */
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.9);
        z-index: 2000;
        justify-content: center;
        align-items: center;
    }

    .modal-content {
        background: var(--f1-black);
        border-top: 4px solid var(--f1-red);
        width: 90%;
        max-width: 400px;
        padding: 30px;
        text-align: center;
    }

    .modal-title {
        font-weight: 900;
        text-transform: uppercase;
        margin-bottom: 20px;
        font-size: 20px;
        letter-spacing: 1px;
    }

    .device-options {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .option-btn {
        background: var(--f1-dark-gray);
        border: none;
        color: white;
        padding: 20px;
        font-weight: bold;
        text-transform: uppercase;
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
    }

    .option-btn:hover { background: var(--f1-red); }
    .option-btn span { font-size: 10px; opacity: 0.7; font-weight: normal; }

    .btn-cancel {
        margin-top: 20px;
        background: transparent;
        color: #666;
        border: none;
        text-transform: uppercase;
        font-size: 12px;
        cursor: pointer;
    }
    </style>
</head>
<body>
    <header>
        <div class="logo">F1<span>PRO</span> MULTIPLAYER</div>
		<button id="btn-change-role" onclick="openModalForce()" style="margin-top: 10px; background: none; border: 1px solid #444; color: #888; font-size: 10px; cursor: pointer; padding: 5px 10px; text-transform: uppercase;">
        ⚙️ Cambiar Modalidad (Actual: <span id="current-role-text">-</span>)
    </button>
    </header>

    <main>
        <div class="section-title">Servidores Activos</div>
        <!-- Aquí es donde inyectaremos las salas -->
        <div id="room-list">
            <div class="loading">Buscando sesiones de carrera...</div>
        </div>
		
		<!-- BOTÓN NUEVO: Oculto por defecto -->
    <button id="btn-create-race" style="display: none; width: 100%; margin-top: 20px; padding: 15px; background-color: var(--f1-red); color: white; border: none; font-weight: 900; text-transform: uppercase; cursor: pointer; letter-spacing: 1px; font-style: italic;" onclick="window.location.href='/setup-race.html'">
        ➕ Crear Nueva Carrera
    </button>
    </main>

    <footer>
        Bahía Blanca Engine v2.0 - 2026
    </footer>

    <!-- SOLO ESTO AL FINAL -->
    <script src="/socket.io/socket.io.js"></script>

    <script type="module" src="/js/lobby-client.js"></script>

<div id="device-modal" style="display: flex;"> 
    <div class="modal-content">
        <div class="modal-title">Seleccionar Rol de Juego</div>
        <div class="device-options">
            <button class="option-btn" onclick="selectDevice('mando')">
                📱 Unirse como Mando
                <span>Usar giroscopio del celular</span>
            </button>
            <button class="option-btn" onclick="selectDevice('tv')">
                📺 Ver como TV
                <span>Modo espectador / Pantalla grande</span>
            </button>
            <button class="option-btn" onclick="selectDevice('solo')">
                💻 Jugar en PC
                <span>Teclado y visualización aquí mismo</span>
            </button>
        </div>
        <button id="btn-cerrar-modal" class="btn-cancel" style="display:none;" onclick="closeModal()">Mantener actual</button>
    </div>
</div>
</body>
</html>
