<!DOCTYPE html>
<html>
<head>
    <title>F1 Pro Simulation - TV</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; left: 30px; color: #fff; text-shadow: 2px 2px #000; pointer-events: none; z-index: 10; }
        
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a; color: white; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
            transition: opacity 0.5s ease;
        }
        .loader {
            border: 4px solid #333; border-top: 4px solid #e10600;
            border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div id="loading-screen">
    <div class="loader"></div>
    <h1>FORMULA 1®</h1>
    <p id="status-text">WAKING UP ENGINE...</p>
</div>
    <div id="ui">
        <h2 style="margin:0; color: #e10600;">FORMULA 1®</h2>
        <p style="margin:0; opacity: 0.7;">LIVE CIRCUIT DATA</p>
    </div>
    <script>
	const socket = io();
	socket.on('connect', () => {
    document.getElementById('status-text').innerText = "CIRCUIT READY";
    setTimeout(() => {
        document.getElementById('loading-screen').style.opacity = '0';
        setTimeout(() => document.getElementById('loading-screen').remove(), 500);
    }, 1000);
});

        const { Engine, Render, Runner, Bodies, Composite, Body, Events } = Matter;

        const engine = Engine.create();
        engine.gravity.y = 0;

        const render = Render.create({
            element: document.body,
            engine: engine,
            options: { 
                width: window.innerWidth, height: window.innerHeight, 
                wireframes: false, background: '#252525' 
            }
        });

        Render.run(render);
        Runner.run(Runner.create(), engine);

        const w = window.innerWidth, h = window.innerHeight;
        const cx = w / 2, cy = h / 2;
        const wallOpt = { isStatic: true, render: { fillStyle: '#111' }, friction: 0 };

        // --- PISTA ---
        const trackLayout = [
            Bodies.circle(cx, cy, 200, wallOpt), // Isla central
            Bodies.rectangle(cx, cy - 300, 650, 20, wallOpt), // Techo
            Bodies.rectangle(cx, cy + 300, 650, 20, wallOpt), // Piso
            Bodies.rectangle(cx - 325, cy, 20, 600, wallOpt),   // Pared Izq
            Bodies.rectangle(cx + 325, cy, 20, 600, wallOpt)    // Pared Der
        ];
        Composite.add(engine.world, trackLayout);

// SENSORES (Ajustados para mejor detección en el carril)
const finishLine = Bodies.rectangle(cx + 280, cy, 150, 20, { 
    isStatic: true, isSensor: true, label: 'finish', render: { fillStyle: 'transparent' }
});

const checkpoint = Bodies.rectangle(cx - 280, cy, 150, 20, { 
    isStatic: true, isSensor: true, label: 'checkpoint', render: { fillStyle: 'transparent' }
});
Composite.add(engine.world, [finishLine, checkpoint]);

        const players = {};

        socket.on('player_update', (data) => {
    if (!players[data.id]) {
        const color = '#' + Math.floor(Math.random()*16777215).toString(16);
        
        // --- LÓGICA DE PARRILLA DE SALIDA ---
        const playerCount = Object.keys(players).length;
        const fila = Math.floor(playerCount / 2); // Cada 2 autos, bajamos una fila
        const columna = playerCount % 2;          // 0 para izquierda, 1 para derecha
        
        // Posicionamiento detrás de la meta (que está en cy)
        // Ajustamos spawnX para que la columna 0 y 1 queden bien centradas en el carril
        const spawnX = (cx + 245) + (columna * 40); 
        const spawnY = (cy + 80) + (fila * 70);

        players[data.id] = Bodies.rectangle(spawnX, spawnY, 60, 25, {
            render: { fillStyle: color },
            frictionAir: 0.1,
            label: 'car',
            angle: -Math.PI / 2 // ORIENTADO HACIA ARRIBA
        });

        players[data.id].myColor = color;
        players[data.id].playerId = data.id;
        players[data.id].laps = 0;
        players[data.id].passedCheckpoint = true;
        
        Composite.add(engine.world, players[data.id]);
    }

    const car = players[data.id];
    car.isGas = data.gas;

    // Movimiento y rotación
    if (data.turn && Math.abs(data.turn) > 0.1) {
        Body.setAngle(car, car.angle + (data.turn * 0.04));
    }
    
    if (data.gas) {
        const force = 0.007;
        Body.applyForce(car, car.position, {
            x: Math.cos(car.angle) * force,
            y: Math.sin(car.angle) * force
        });
    }
});

        Events.on(engine, 'collisionStart', (event) => {
    event.pairs.forEach((pair) => {
        const { bodyA, bodyB } = pair;
        // Buscamos cuál de los dos es el auto y cuál el sensor
        const car = bodyA.label === 'car' ? bodyA : (bodyB.label === 'car' ? bodyB : null);
        const sensor = bodyA.isSensor ? bodyA : (bodyB.isSensor ? bodyB : null);

        if (car && sensor) {
            if (sensor.label === 'checkpoint') {
                car.passedCheckpoint = true;
            }
            if (sensor.label === 'finish' && car.passedCheckpoint) {
                car.laps++;
                car.passedCheckpoint = false;
            }
        }
    });
});

        Events.on(render, 'afterRender', () => {
            const ctx = render.context;

            // 1. DIBUJAR LÍNEA DE META (Extendida: +1 izq, +2 der)
const celda = 6;
const columnasH = 18; // Antes era 14, ahora sumamos 3 (1+2)
const filasH = 2;    
// Restamos 'celda' a la posición X para que crezca un cuadrado hacia la izquierda
const metaX = (cx + 210) - celda; 
const metaY = cy;      

for (let f = 0; f < filasH; f++) {
    for (let c = 0; c < columnasH; c++) {
        ctx.fillStyle = (f + c) % 2 === 0 ? "#fff" : "#000";
        ctx.fillRect(metaX + (c * celda), metaY + (f * celda), celda, celda);
    }
}

// Línea roja horizontal (ajustada al nuevo ancho)
ctx.fillStyle = "#e10600";
ctx.fillRect(metaX, metaY + (filasH * celda), columnasH * celda, 2);

            // 2. TABLA DE POSICIONES
            const leaderboard = Object.values(players).sort((a, b) => b.laps - a.laps);
            if (leaderboard.length > 0) {
                const topLaps = leaderboard[0].laps;
                const startX = window.innerWidth - 220;
                let startY = 60;

                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(startX - 10, 20, 200, leaderboard.length * 35 + 20);

                leaderboard.forEach((p, i) => {
                    ctx.fillStyle = p.myColor;
                    ctx.font = "bold 18px Arial";
                    ctx.textAlign = "left";
                    ctx.fillText(`P${i+1} ${p.playerId.substring(0,4)}`, startX, startY);
                    ctx.fillText(`LAP: ${p.laps}`, startX + 100, startY);
                    startY += 35;
                });
            }

            // 3. DIBUJAR AUTOS (Diseño Monoplaza Clásico)
Object.values(players).forEach(car => {
    const { position, angle, myColor, isGas } = car;
    ctx.save();
    ctx.translate(position.x, position.y);
    ctx.rotate(angle);

    const brillo = isGas ? 12 : 4;

    // --- NEUMÁTICOS (Anchos y por fuera de la carrocería) ---
    ctx.fillStyle = '#111';
    ctx.fillRect(12, -18, 10, 8);  // Delantero Izq
    ctx.fillRect(12, 10, 10, 8);   // Delantero Der
    ctx.fillRect(-22, -20, 12, 10); // Trasero Izq (Más ancho)
    ctx.fillRect(-22, 10, 12, 10);  // Trasero Der (Más ancho)

    // --- CARROCERÍA (Forma de flecha/botella) ---
    ctx.fillStyle = myColor;
    // Nariz y chasis central
    ctx.beginPath();
    ctx.moveTo(25, 0);       // Punta de la nariz
    ctx.lineTo(5, -7);       // Ensancha hacia el cockpit
    ctx.lineTo(-25, -9);     // Parte trasera
    ctx.lineTo(-25, 9);
    ctx.lineTo(5, 7);
    ctx.closePath();
    ctx.fill();

    // Toma de aire (Airbox) arriba del motor
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(-10, -4, 12, 8);

    // Casco del piloto (Círculo pequeño)
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();

    // --- ALERONES ---
    ctx.fillStyle = '#111';
    ctx.fillRect(20, -14, 3, 28);  // Alerón delantero
    ctx.fillRect(-32, -16, 8, 32); // Alerón trasero grande

// --- SISTEMA DE 4 LUCES (Reposicionadas) ---
    // Delanteras (Ámbar) - Ahora inmediatamente detrás del alerón delantero
    ctx.fillStyle = '#ffaa00'; 
    ctx.shadowBlur = brillo;
    ctx.shadowColor = '#ffaa00';
    ctx.fillRect(18, -6, 4, 2); // Posición X movida a 18
    ctx.fillRect(18, 4, 4, 2);  // Posición X movida a 18

    // Traseras (Rojas) - Se mantienen en la parte posterior
    ctx.fillStyle = '#ff0000'; 
    ctx.shadowBlur = brillo;
    ctx.shadowColor = '#ff0000';
    ctx.fillRect(-25, -8, 4, 2); 
    ctx.fillRect(-25, 6, 4, 2); 

    ctx.shadowBlur = 0; // Limpiar brillo

    ctx.shadowBlur = 0; // Limpiar brillo

    // --- FUEGO DEL ESCAPE ---
    if (isGas) {
        ctx.fillStyle = '#ff4400';
        ctx.beginPath();
        ctx.moveTo(-33, 0);
        ctx.lineTo(-50, -6);
        ctx.lineTo(-50, 6);
        ctx.fill();
    }

    ctx.restore();
});
        });

        socket.on('player_disconnected', (id) => {
            if (players[id]) { Composite.remove(engine.world, players[id]); delete players[id]; }
        });
		
		
    </script>
	
</body>

</html>
