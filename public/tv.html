<!DOCTYPE html>
<html>
<head>
    <title>F1 Pro - Visualizer</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 20px; left: 30px; color: #fff; pointer-events: none; z-index: 10; }
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a; color: white; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }
    </style>
</head>
<body>

<div id="loading-screen"><h1>FORMULA 1®</h1><p>SYNCING WITH SERVER...</p></div>

<div id="ui">
    <h2 style="color: #e10600; margin:0; letter-spacing: 2px;">LIVE CIRCUIT DATA</h2>
    <p id="player-count" style="margin:0; opacity: 0.7;">Waiting for pilots...</p>
</div>

<canvas id="renderCanvas"></canvas>

<script>
    const socket = io();
    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');
    
    let gameState = { players: [] };
    let particles = []; 
    const worldWidth = 1600; 
    const worldHeight = 900;

    // 1. CLASE DE PARTÍCULAS
    class Particle {
        constructor(x, y, color, isOnGrass) {
            this.x = x;
            this.y = y;
            this.color = isOnGrass ? (Math.random() > 0.5 ? "#4b3621" : "#2d5a27") : "#555";
            this.vx = (Math.random() - 0.5) * 4;
            this.vy = (Math.random() - 0.5) * 4;
            this.life = 1.0;
            this.size = Math.random() * 4 + 2;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= 0.02;
        }
        draw(c) {
            c.globalAlpha = this.life;
            c.fillStyle = this.color;
            c.beginPath();
            c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            c.fill();
            c.globalAlpha = 1.0;
        }
    }

    // 2. CONFIGURACIÓN DE VENTANA
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 3. COMUNICACIÓN
    socket.on('connect', () => {
        console.log("Conectado al servidor");
        document.getElementById('loading-screen').style.display = 'none';
    });

    socket.on('state_update', (data) => {
        gameState = data;
        const label = document.getElementById('player-count');
        if(label && data.players) label.innerText = `${data.players.length} PILOTS ON TRACK`;
    });

    // 4. FUNCIONES DE DIBUJO
	
	function drawGridMarks() {
    const GRID_START_X = 740;
    const GRID_START_Y = 610;
    const OFFSET_X = -100;
    const OFFSET_Y = 80;
    const MAX_SLOTS = 8; // Dibujamos marcas para 10 autos

    ctx.save();
    ctx.strokeStyle = "rgba(255, 255, 255, 0.5)"; // Blanco semi-transparente
    ctx.lineWidth = 3;

    for (let i = 0; i < MAX_SLOTS; i++) {
        const row = Math.floor(i / 2);
        const col = i % 2;
        
        const x = GRID_START_X + (row * OFFSET_X);
        const y = GRID_START_Y + (col * OFFSET_Y);

        // Dibujar el bracket "]" (orientado hacia la izquierda porque los autos miran hacia allá)
        // La trompa del auto encaja en la parte abierta del bracket
        const size = 30; // Largo de la marca
        const wing = 15; // Largo de las pestañas

        ctx.beginPath();
        // Línea vertical del bracket (atrás de la trompa)
        ctx.moveTo(x + 35, y - wing); 
        ctx.lineTo(x + 35, y + wing);
        
        // Pestaña superior
        ctx.moveTo(x + 35, y - wing);
        ctx.lineTo(x + 15, y - wing);
        
        // Pestaña inferior
        ctx.moveTo(x + 35, y + wing);
        ctx.lineTo(x + 15, y + wing);
        
        ctx.stroke();

        // Opcional: Número de posición tenue
        ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
        ctx.font = "bold 12px Arial";
        ctx.fillText(i + 1, x + 40, y + 5);
    }
    ctx.restore();
}
function drawTrack() {
    const trackW = 1000, trackH = 400;
    const trackX = (worldWidth - trackW) / 2;
    const trackY = (worldHeight - trackH) / 2;
    const radius = 100, roadWidth = 150;

    // --- PASTO CON RAYAS (estilo Pole Position) ---
    for (let i = 0; i < worldHeight; i += 40) {
        ctx.fillStyle = i % 80 === 0 ? "#1e3a1e" : "#1a3318";
        ctx.fillRect(0, i, worldWidth, 40);
    }

    // --- PIANO EXTERIOR (kerb) ---
    // Rojo
    ctx.strokeStyle = "#cc0000";
    ctx.lineWidth = roadWidth + 28;
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.roundRect(trackX, trackY, trackW, trackH, radius);
    ctx.stroke();
    // Tablero de ajedrez blanco encima
    ctx.setLineDash([28, 28]);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = roadWidth + 28;
    ctx.beginPath();
    ctx.roundRect(trackX, trackY, trackW, trackH, radius);
    ctx.stroke();
    ctx.setLineDash([]);

    // --- ASFALTO ---
    ctx.strokeStyle = "#222222";
    ctx.lineWidth = roadWidth;
    ctx.beginPath();
    ctx.roundRect(trackX, trackY, trackW, trackH, radius);
    ctx.stroke();

    // --- BORDE BLANCO TENUE (límite de pista) ---
    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(trackX, trackY, trackW, trackH, radius);
    ctx.stroke();

// --- LÍNEA CENTRAL DISCONTINUA ---
ctx.strokeStyle = "rgba(255,255,255,0.3)";
ctx.lineWidth = 2;
ctx.setLineDash([18, 30]);
ctx.beginPath();
ctx.roundRect(
    trackX + roadWidth / 2,
    trackY + roadWidth / 2,
    trackW - roadWidth,
    trackH - roadWidth,
    radius - 50
);
ctx.stroke();
ctx.setLineDash([]);
   // --- INTERIOR VERDE ---
    ctx.fillStyle = "#1e3a1e";
    ctx.beginPath();
    ctx.roundRect(trackX + roadWidth/2, trackY + roadWidth/2, trackW - roadWidth, trackH - roadWidth, radius - 50);
    ctx.fill();

    // --- BORDE INTERIOR BLANCO TENUE ---
    ctx.strokeStyle = "rgba(255,255,255,0.12)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(trackX + roadWidth/2, trackY + roadWidth/2, trackW - roadWidth, trackH - roadWidth, radius - 50);
    ctx.stroke();

    // --- LÍNEA CENTRAL DISCONTINUA (encima del verde) ---
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.lineWidth = 2;
    ctx.setLineDash([18, 30]);
    ctx.beginPath();
    ctx.roundRect(
        trackX + roadWidth / 2,
        trackY + roadWidth / 2,
        trackW - roadWidth,
        trackH - roadWidth,
        radius - 50
    );
    ctx.stroke();
    ctx.setLineDash([]);

    // --- LÍNEA DE META ---
    const flagX = worldWidth / 2 - 6;
    const flagY = trackY + trackH - roadWidth/2 - 2;
    const tileSize = 12;
    const cols = 1, rows = Math.floor(roadWidth / tileSize);
    ctx.save();
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols * 2; c++) {
            ctx.fillStyle = (r + c) % 2 === 0 ? "#ffffff" : "#000000";
            ctx.fillRect(flagX + c * tileSize, flagY + r * tileSize, tileSize, tileSize);
        }
    }
    ctx.restore();

    // --- NOMBRE DEL CIRCUITO ---
    ctx.save();
    ctx.font = "bold 22px 'Segoe UI', monospace";
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    ctx.textAlign = "center";
    ctx.fillText("GRAND PRIX CIRCUIT", worldWidth / 2, trackY + trackH / 2 + 8);
    ctx.restore();

    // --- CONO DE CHECKPOINT (recta de arriba) ---
    const coneX = worldWidth / 2;
    const coneY = trackY + roadWidth / 2;
    ctx.save();
    ctx.translate(coneX, coneY);
    // Base naranja
    ctx.fillStyle = "#ff6600";
    ctx.beginPath();
    ctx.moveTo(-8, 16); ctx.lineTo(8, 16); ctx.lineTo(0, -16);
    ctx.closePath();
    ctx.fill();
    // Franja blanca
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.moveTo(-5, 6); ctx.lineTo(5, 6); ctx.lineTo(3, -2); ctx.lineTo(-3, -2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}
function drawTireBarrier() {
    if (!gameState.tireBarrier) return;
    gameState.tireBarrier.forEach((t, i) => {
        const isRed = i % 2 === 0;
        // Goma exterior
        ctx.beginPath();
        ctx.arc(t.x, t.y, 18, 0, Math.PI * 2);
        ctx.fillStyle = "#1a1a1a";
        ctx.fill();
        // Banda de color (rojo o blanco)
        ctx.beginPath();
        ctx.arc(t.x, t.y, 18, 0, Math.PI * 2);
        ctx.strokeStyle = isRed ? "#cc0000" : "#ffffff";
        ctx.lineWidth = 5;
        ctx.stroke();
        // Aro interior
        ctx.beginPath();
        ctx.arc(t.x, t.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = "#333";
        ctx.fill();
    });
}
function drawPlayer(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);

    // --- SOMBRA ---
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.ellipse(4, 3, 22, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    // --- DIFUSOR TRASERO ---
    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.moveTo(-22, -7); ctx.lineTo(-16, -9); ctx.lineTo(-16, 9); ctx.lineTo(-22, 7);
    ctx.closePath();
    ctx.fill();

    // --- RUEDAS TRASERAS ---
    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath(); ctx.ellipse(-10, -13, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-10,  13, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
    // Aro
    ctx.strokeStyle = "#444"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(-10, -13, 3, 2.5, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-10,  13, 3, 2.5, 0, 0, Math.PI * 2); ctx.stroke();

    // --- RUEDAS DELANTERAS ---
    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath(); ctx.ellipse(16, -12, 4, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(16,  12, 4, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#444"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(16, -12, 2.5, 2, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(16,  12, 2.5, 2, 0, 0, Math.PI * 2); ctx.stroke();

    // --- ALERÓN TRASERO ---
    ctx.fillStyle = p.color;
    ctx.fillRect(-21, -11, 10, 3);
    ctx.fillRect(-21,  8,  10, 3);
    ctx.fillStyle = "#222";
    ctx.fillRect(-20, -8, 2, 16); // soporte central

    // --- CHASIS PRINCIPAL ---
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.moveTo(-18, -8);
    ctx.lineTo(10, -7);
    ctx.lineTo(24, -3);
    ctx.lineTo(28, 0);
    ctx.lineTo(24,  3);
    ctx.lineTo(10,  7);
    ctx.lineTo(-18,  8);
    ctx.closePath();
    ctx.fill();

    // Detalle lateral oscuro
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath();
    ctx.moveTo(-18, -4); ctx.lineTo(20, -3); ctx.lineTo(20, 3); ctx.lineTo(-18, 4);
    ctx.closePath();
    ctx.fill();

    // --- PONTONES (sidepods) ---
    ctx.fillStyle = shadeColor(p.color, -40);
    ctx.beginPath();
    ctx.moveTo(-5, -8); ctx.lineTo(14, -8); ctx.lineTo(14, -11); ctx.lineTo(-5, -11);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-5, 8); ctx.lineTo(14, 8); ctx.lineTo(14, 11); ctx.lineTo(-5, 11);
    ctx.closePath();
    ctx.fill();

    // --- COCKPIT ---
    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.ellipse(3, 0, 6, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();
    // Visor
    ctx.fillStyle = "rgba(100,200,255,0.4)";
    ctx.beginPath();
    ctx.ellipse(5, 0, 4, 2.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // --- ALERÓN DELANTERO ---
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.moveTo(22, -5); ctx.lineTo(30, -8); ctx.lineTo(31, -6);
    ctx.lineTo(24, -3); ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(22, 5); ctx.lineTo(30, 8); ctx.lineTo(31, 6);
    ctx.lineTo(24, 3); ctx.closePath();
    ctx.fill();

    // --- HALO ---
    ctx.strokeStyle = shadeColor(p.color, -20);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(2, 0, 7, 4, 0, 0, Math.PI * 2);
    ctx.stroke();

    // --- TURBO GLOW ---
    if (p.isTurbo) {
        ctx.strokeStyle = "rgba(0,220,255,0.7)";
        ctx.lineWidth = 2;
        ctx.shadowColor = "cyan";
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(-18, -8); ctx.lineTo(10, -7); ctx.lineTo(28, 0);
        ctx.lineTo(10, 7); ctx.lineTo(-18, 8); ctx.closePath();
        ctx.stroke();
        ctx.shadowBlur = 0;
        // Llama del escape
        ctx.fillStyle = "rgba(255,140,0,0.8)";
        ctx.beginPath();
        ctx.moveTo(-18, -3);
        ctx.lineTo(-26 - Math.random() * 8, 0);
        ctx.lineTo(-18, 3);
        ctx.closePath();
        ctx.fill();
    }
	

    ctx.restore();
}

// Helper: oscurecer/aclarar un color hex
function shadeColor(color, amount) {
    const num = parseInt(color.replace("#",""), 16);
    const r = Math.min(255, Math.max(0, (num >> 16) + amount));
    const g = Math.min(255, Math.max(0, ((num >> 8) & 0xFF) + amount));
    const b = Math.min(255, Math.max(0, (num & 0xFF) + amount));
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}


function drawLeaderboard() {
    if (!gameState.players || gameState.players.length === 0) return;
    
    // Ordenar por vueltas y luego por posición en pista (opcional)
    const sorted = [...gameState.players].sort((a, b) => (b.laps || 0) - (a.laps || 0));
    
    const x = 30;
    const y = 80;
    const rowHeight = 35;
    const width = 220;

    ctx.save();
    
    // Encabezado "TOWER"
    ctx.fillStyle = "#e10600"; // Rojo F1
    ctx.fillRect(x, y, width, 30);
    ctx.fillStyle = "white";
    ctx.font = "bold 14px 'Segoe UI'";
    ctx.fillText("POS    DRIVER", x + 10, y + 20);
    ctx.textAlign = "right";
    ctx.fillText("LAPS", x + width - 10, y + 20);
    ctx.textAlign = "left";

    sorted.forEach((p, i) => {
        const rowY = y + 30 + (i * rowHeight);
        
        // Fondo de fila (alternado para legibilidad)
        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(x, rowY, width, rowHeight - 2);

        // Barra de color del equipo/auto
        ctx.fillStyle = p.color;
        ctx.fillRect(x, rowY, 5, rowHeight - 2);

        // Texto de posición y Nombre (ID corto)
        ctx.fillStyle = "white";
        ctx.font = "600 14px 'Segoe UI'";
        ctx.fillText(`${i + 1}`, x + 15, rowY + 22);
        
        ctx.fillStyle = "#ccc";
        ctx.font = "400 13px 'Segoe UI'";
        ctx.fillText(p.id.slice(0, 5).toUpperCase(), x + 45, rowY + 22);

        // Vueltas
        ctx.textAlign = "right";
        ctx.fillStyle = "white";
        ctx.fillText(`${p.laps || 0}`, x + width - 10, rowY + 22);
        ctx.textAlign = "left";

        // Indicador si está en PITS o GRASS (pequeño punto)
        if (p.isOnGrass) {
            ctx.fillStyle = "#ffcc00";
            ctx.beginPath();
            ctx.arc(x + width - 50, rowY + 18, 4, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    ctx.restore();
}

    // 5. LOOP PRINCIPAL
// 5. LOOP PRINCIPAL
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        const scale = Math.min(canvas.width / worldWidth, canvas.height / worldHeight);
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.scale(scale, scale);
        ctx.translate(-worldWidth / 2, -worldHeight / 2);

        drawTrack();
		drawGridMarks();
drawTireBarrier();
        // Partículas: Filtrar y actualizar
        particles = particles.filter(p => p.life > 0);
        particles.forEach(p => { p.update(); p.draw(ctx); });

        // Jugadores y Generación de Partículas
        if (gameState.players) {
            gameState.players.forEach(p => {
                // Lógica de pasto: si está en el pasto y moviéndose
                if (p.isOnGrass && p.speed > 0.5) {
    for (let i = 0; i < 5; i++) {  // más partículas
        const offsetX = -Math.cos(p.angle) * 20;
        const offsetY = -Math.sin(p.angle) * 20;
        particles.push(new Particle(
            p.x + offsetX + (Math.random() - 0.5) * 10,
            p.y + offsetY + (Math.random() - 0.5) * 10,
            p.color,
            true  // ← isOnGrass = true para colores tierra/pasto
        ));
    }
}
                drawPlayer(p); // Dibujar al jugador después de las partículas
            });
        }
        
        ctx.restore();

        drawLeaderboard();
        requestAnimationFrame(draw);
    }

    // Iniciar
    requestAnimationFrame(draw);
</script>
</body>
</html>
