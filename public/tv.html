<!DOCTYPE html>
<html>
<head>
    <title>F1 Pro Simulation - TV</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; left: 30px; color: #fff; text-shadow: 2px 2px #000; pointer-events: none; z-index: 10; }
        
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a; color: white; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
            transition: opacity 0.5s ease;
        }
        .loader {
            border: 4px solid #333; border-top: 4px solid #e10600;
            border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
		
		#lights-container {
            position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
            display: none; gap: 20px; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 20px;
        }
        .light { width: 60px; height: 60px; border-radius: 50%; background: #333; }
        .red { background: #ff0000; box-shadow: 0 0 20px #ff0000; }
        .yellow { background: #ffaa00; box-shadow: 0 0 20px #ffaa00; }
        .green { background: #00ff00; box-shadow: 0 0 20px #00ff00; }
    </style>
</head>
<body>
<div id="loading-screen">
    <div class="loader"></div>
    <h1>FORMULA 1®</h1>
    <p id="status-text">WAKING UP ENGINE...</p>
</div>
    <div id="ui">
        <h2 style="margin:0; color: #e10600;">FORMULA 1®</h2>
        <p style="margin:0; opacity: 0.7;">LIVE CIRCUIT DATA</p>
    </div>
	<div id="lights-container">
    <div id="l1" class="light"></div>
    <div id="l2" class="light"></div>
    <div id="l3" class="light"></div>
</div>

<script>
	const socket = io();

	socket.on('connect', () => {
        document.getElementById('status-text').innerText = "CIRCUIT READY";
        setTimeout(() => {
            const screen = document.getElementById('loading-screen');
            if(screen) {
                screen.style.opacity = '0';
                setTimeout(() => screen.remove(), 500);
            }
        }, 1000);
    });

    socket.on('start_countdown', () => {
        const container = document.getElementById('lights-container');
        const l1 = document.getElementById('l1');
        const l2 = document.getElementById('l2');
        const l3 = document.getElementById('l3');

        container.style.display = 'flex';
        
        setTimeout(() => l1.classList.add('red'), 1000);
        setTimeout(() => l2.classList.add('yellow'), 2000);
        setTimeout(() => l3.classList.add('green'), 3000);
        
        setTimeout(() => {
            container.style.display = 'none';
            l1.classList.remove('red');
            l2.classList.remove('yellow');
            l3.classList.remove('green');
        }, 5000);
    });

    const { Engine, Render, Runner, Bodies, Composite, Body, Events } = Matter;
    const engine = Engine.create();
    engine.gravity.y = 0; 

    const render = Render.create({
        element: document.body,
        engine: engine,
        options: { 
            width: window.innerWidth, height: window.innerHeight, 
            wireframes: false, background: '#252525' 
        }
    });

    Render.run(render);
    Runner.run(Runner.create(), engine);

    const w = window.innerWidth, h = window.innerHeight;
    const cx = w / 2, cy = h / 2;
    const wallOpt = { isStatic: true, render: { fillStyle: '#111' }, friction: 0 };

    const trackLayout = [
        Bodies.circle(cx - 400, cy, 200, wallOpt), 
		Bodies.circle(cx + 400, cy , 200, wallOpt), 
        Bodies.rectangle(cx, cy - 300, 1450, 20, wallOpt), 
        Bodies.rectangle(cx, cy + 300, 1450, 20, wallOpt), 
		Bodies.rectangle(cx, cy  , 800, 400, wallOpt), 
        Bodies.rectangle(cx - 725, cy, 20, 600, wallOpt), 
        Bodies.rectangle(cx + 725, cy, 20, 600, wallOpt)  
    ];
    Composite.add(engine.world, trackLayout);

    const players = {}; 

    const finishLine = Bodies.rectangle(cx + 330, cy + 250, 40, 100, { 
        isStatic: true, isSensor: true, label: 'finish', render: { fillStyle: 'transparent' }
    });
    const checkpoint = Bodies.rectangle(cx - 330, cy + 250, 40, 100, { 
        isStatic: true, isSensor: true, label: 'checkpoint', render: { fillStyle: 'transparent' }
    });
    Composite.add(engine.world, [finishLine, checkpoint]);

    socket.on('player_update', (data) => {
        if (!players[data.id]) {		
            const color = '#' + Math.floor(Math.random()*16777215).toString(16);
            const playerCount = Object.keys(players).length;
            const spawnX = (cx + 100) - (playerCount * 80); 
            const spawnY = (cy + 250);

            players[data.id] = Bodies.rectangle(spawnX, spawnY, 60, 25, {
                render: { fillStyle: color },
                density: 0.1,
                frictionAir: 0.01,
                restitution: 0.2,
                friction: 0.1,
                label: 'car'
            });

            Body.setInertia(players[data.id], 500000); 

            players[data.id].myColor = color;
            players[data.id].playerId = data.id;
            players[data.id].laps = 0;
            players[data.id].passedCheckpoint = false;
            players[data.id].isGas = false;
            players[data.id].turnValue = 0;

            Composite.add(engine.world, players[data.id]);
        }

        const car = players[data.id];
        car.isGas = data.gas; 
        car.turnValue = data.turn || 0; 
    });

    Events.on(engine, 'collisionStart', (event) => {
        event.pairs.forEach((pair) => {
            const { bodyA, bodyB } = pair;
            const car = bodyA.label === 'car' ? bodyA : (bodyB.label === 'car' ? bodyB : null);
            const sensor = bodyA.isSensor ? bodyA : (bodyB.isSensor ? bodyB : null);

            if (car && sensor) {
                if (sensor.label === 'checkpoint') {
                    car.passedCheckpoint = true;
                }
                if (sensor.label === 'finish' && car.passedCheckpoint) {
                    car.laps++;
                    car.passedCheckpoint = false;
                }
            }
            
            // Corrección de choques con paredes
            if (car && !bodyA.isSensor && !bodyB.isSensor) {
                Body.setVelocity(car, { x: car.velocity.x * 0.1, y: car.velocity.y * 0.1 });
                Body.setAngularVelocity(car, 0);
            }
        });
    });

    Events.on(render, 'afterRender', () => {
        const ctx = render.context;
        const celda = 10, columnasH = 2, filasH = 9; 
		const metaX = cx + 330; 
		const metaY = (cy + 250) - (filasH * celda / 2);

		for (let f = 0; f < filasH; f++) {
			for (let c = 0; c < columnasH; c++) {
				ctx.fillStyle = (f + c) % 2 === 0 ? "#fff" : "#000";
				ctx.fillRect(metaX + (c * celda), metaY + (f * celda), celda, celda);
			}
		}
		ctx.fillStyle = "#e10600"; 
		ctx.fillRect(metaX - 3, metaY, 3, filasH * celda);

        const leaderboard = Object.values(players).sort((a, b) => b.laps - a.laps);
        if (leaderboard.length > 0) {
            const startX = window.innerWidth - 220;
            let startY = 60;
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(startX - 10, 20, 200, leaderboard.length * 35 + 20);

            leaderboard.forEach((p, i) => {
                ctx.fillStyle = p.myColor;
                ctx.font = "bold 18px Arial";
                ctx.textAlign = "left";
                ctx.fillText(`P${i+1} ${p.playerId.substring(0,4)}`, startX, startY);
                ctx.fillText(`LAP: ${p.laps}`, startX + 100, startY);
                startY += 35;
            });
        }

        Object.values(players).forEach(car => {
            const { position, angle, myColor, isGas } = car;
            ctx.save();
            ctx.translate(position.x, position.y);
            ctx.rotate(angle);
            
            ctx.fillStyle = '#111';
            ctx.fillRect(12, -18, 10, 8);  ctx.fillRect(12, 10, 10, 8);
            ctx.fillRect(-22, -20, 12, 10); ctx.fillRect(-22, 10, 12, 10);

            ctx.fillStyle = myColor;
            ctx.beginPath();
            ctx.moveTo(25, 0); ctx.lineTo(5, -7); ctx.lineTo(-25, -9);
            ctx.lineTo(-25, 9); ctx.lineTo(5, 7); ctx.closePath();
            ctx.fill();

            ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(-10, -4, 12, 8);
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#111'; ctx.fillRect(20, -14, 3, 28); ctx.fillRect(-32, -16, 8, 32);

            if (isGas) {
                ctx.fillStyle = '#ff4400';
                ctx.beginPath(); ctx.moveTo(-33, 0); ctx.lineTo(-50, -6); ctx.lineTo(-50, 6); ctx.fill();
            }
            ctx.restore();
        });
    });

    socket.on('player_disconnected', (id) => {
        if (players[id]) { Composite.remove(engine.world, players[id]); delete players[id]; }
    });
		
   // --- LÓGICA DE FÍSICA (Antes de cada actualización del motor) ---
// --- LÓGICA DE FÍSICA (Antes de cada actualización del motor) ---
    // --- LÓGICA DE FÍSICA (Actualizada) ---
    Events.on(engine, 'beforeUpdate', () => {
        Object.values(players).forEach(car => {
            const angle = car.angle;
            const forwardVector = { x: Math.cos(angle), y: Math.sin(angle) };
            const rightVector = { x: Math.cos(angle + Math.PI / 2), y: Math.sin(angle + Math.PI / 2) };

            // 1. CÁLCULO DE VELOCIDAD LINEAL ACTUAL
            const speed = Math.sqrt(car.velocity.x ** 2 + car.velocity.y ** 2);

            // 2. MATAR VELOCIDAD LATERAL (Agarre)
            const lateralVel = car.velocity.x * rightVector.x + car.velocity.y * rightVector.y;
            const driftControl = 0.96; 
            Body.setVelocity(car, {
                x: car.velocity.x - (rightVector.x * lateralVel * driftControl),
                y: car.velocity.y - (rightVector.y * lateralVel * driftControl)
            });

            // 3. ACELERACIÓN LINEAL
            if (car.isGas) {
                const accelForce = 0.035; // Un toque más de fuerza
                Body.applyForce(car, car.position, {
                    x: forwardVector.x * accelForce,
                    y: forwardVector.y * accelForce
                });
            }

            // 4. DIRECCIÓN (Solución al giro liviano)
            if (car.turnValue !== 0) {
                // El giro se escala con la velocidad (speed / 10). 
                // Si el auto está quieto, gira casi nada. A más velocidad, dobla más.
                const turnFactor = Math.min(speed / 8, 1.2); 
                const turnSpeed = 0.06 * turnFactor; 
                Body.setAngularVelocity(car, car.turnValue * turnSpeed);
            } else {
                // Si no se toca el mando, frenamos la rotación residual
                Body.setAngularVelocity(car, car.angularVelocity * 0.9);
            }

            // 5. VELOCIDAD MÁXIMA (Fricción de rodamiento)
            // 0.995 permite que el auto siga acelerando mucho más antes de frenarse por el aire
            const topSpeedControl = 0.993; 
            Body.setVelocity(car, {
                x: car.velocity.x * topSpeedControl,
                y: car.velocity.y * topSpeedControl
            });
        });
    });
</script>
</body>
</html>
