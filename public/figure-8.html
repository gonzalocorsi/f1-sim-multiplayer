<!DOCTYPE html>
<html>
<head>
	<title>F1 Pro - Visualizer</title>
    <script src="/socket.io/socket.io.js"></script>
	<style>
		body { margin: 0; background: #1a1a1a; }
		canvas { display: block; width: 100vw; height: 100vh; }
		#ui { position: absolute; top: 20px; left: 30px; color: #fff; pointer-events: none; z-index: 10; }
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a; color: white; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }
	</style>
</head>
<body>
<div id="loading-screen"><h1>FORMULA 1®</h1><p>SYNCING WITH SERVER...</p></div>
<div id="ui">
    <h2 style="color: #e10600; margin:0; letter-spacing: 2px;">LIVE CIRCUIT DATA</h2>
    <p id="player-count" style="margin:0; opacity: 0.7;">Waiting for pilots...</p>
</div>
<canvas id="renderCanvas"></canvas>

<!-- SEMÁFORO -->
<div id="countdown-overlay" style="
    display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.6); z-index:500;
    align-items:center; justify-content:center;
    font-size:180px; font-weight:900; color:#fff; font-family:monospace;
"></div>

<!-- PODIO -->
<div id="podio-overlay" style="
    display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.88); z-index:600;
    flex-direction:column; align-items:center; justify-content:center; gap:20px;
">
    <div style="font-size:42px; font-weight:900; color:#fff;">🏁 FIN DE CARRERA</div>
    <div id="podio-lista" style="display:flex; flex-direction:column; gap:12px; align-items:center;"></div>
    <button onclick="window.location.href='/'" style="
        margin-top:20px; padding:14px 36px; font-size:20px;
        background:#e10600; color:#fff; border:none; border-radius:12px; font-weight:bold; cursor:pointer;
    ">VOLVER AL LOBBY</button>
</div>
<script>
let currentHostId = null;
    const socket = io();
  const canvas = document.getElementById('renderCanvas');
  const ctx = canvas.getContext('2d');
  
  let gameState = { players: [] };
  let particles = []; 
  const worldWidth = 1600; 
  const worldHeight = 900;

// --- CONSTANTES DE PISTA (actualizadas a roadWidth=150) ---
const TRACK = {
    cx: 800,
    cy: 450,
    gap: 20,
    rx: 300,       // era 280, crece +20 hacia afuera
    ry: 190,       // era 170, crece +20 hacia afuera
    roadWidth: 150 // igual al circuito 1
};
TRACK.leftCX  = TRACK.cx - TRACK.gap / 2 - TRACK.rx;  // 490
TRACK.rightCX = TRACK.cx + TRACK.gap / 2 + TRACK.rx;  // 1110
TRACK.irx = TRACK.rx - TRACK.roadWidth / 2;            // 225
TRACK.iry = TRACK.ry - TRACK.roadWidth / 2;            // 115

// 1. CLASE DE PARTÍCULAS
    class Particle {
        constructor(x, y, color, isOnGrass) {
            this.x = x;
            this.y = y;
            this.color = isOnGrass ? (Math.random() > 0.5 ? "#4b3621" : "#2d5a27") : "#555";
            this.vx = (Math.random() - 0.5) * 4;
            this.vy = (Math.random() - 0.5) * 4;
            this.life = 1.0;
            this.size = Math.random() * 4 + 2;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= 0.02;
        }
        draw(c) {
            c.globalAlpha = this.life;
            c.fillStyle = this.color;
            c.beginPath();
            c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            c.fill();
            c.globalAlpha = 1.0;
        }
    }
// 2. CONFIGURACIÓN DE VENTANA
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

// 3. COMUNICACIÓN
const urlParams = new URLSearchParams(window.location.search);
const roomId = urlParams.get('room') || 'default-room';

socket.on('connect', () => {
    console.log("Conectado al servidor - Sala:", roomId);
    document.getElementById('loading-screen').style.display = 'none';
    socket.emit('join_session', { roomId, type: 'tv' });
    socket.onAny((event, ...args) => {
        if (event !== 'state_update') {
            console.log('📨 Evento recibido:', event, args);
        }
    });
});

socket.on('state_update', (data) => {
    gameState = data;
    const label = document.getElementById('player-count');
    if(label && data.players) {
        label.innerText = `${data.players.length} PILOTS ON TRACK IN ${roomId.toUpperCase()}`;
    }
});

// SEMÁFORO
const countdownOverlay = document.getElementById('countdown-overlay');
socket.on('countdown', (n) => {
    countdownOverlay.style.display = 'flex';
    if (n === 0) {
        countdownOverlay.style.color = '#00ff00';
        countdownOverlay.innerText = 'GO!';
        setTimeout(() => {
            countdownOverlay.style.display = 'none';
            countdownOverlay.style.color = '#fff';
        }, 900);
    } else {
        countdownOverlay.style.color = '#fff';
        countdownOverlay.innerText = n;
    }
});

socket.on('force_reload', () => {
    document.getElementById('podio-overlay').style.display = 'none';
    document.getElementById('countdown-overlay').style.display = 'none';
});

// PODIO
socket.on('race_finished', ({ winnerId, podio }) => {
    currentHostId = winnerId;
    const overlay = document.getElementById('podio-overlay');
    const lista   = document.getElementById('podio-lista');
    console.log('ganador: ', winnerId);
    const medallas = ['🥇', '🥈', '🥉'];
    if (!podio || podio.length === 0) {
        lista.innerHTML = '<div style="color:#fff; font-size:20px;">Sin datos de podio</div>';
    } else {
        lista.innerHTML = podio.map((p, i) => `
            <div style="
                display:flex; align-items:center; gap:16px;
                background:rgba(255,255,255,0.08); border-radius:12px;
                padding:12px 28px; min-width:280px;
            ">
                <span style="font-size:36px;">${medallas[i] || `${i + 1}.`}</span>
                <div style="width:28px; height:28px; border-radius:50%; background:${p.color};"></div>
                <span style="font-size:22px; color:#fff; font-weight:bold;">
                    ${p.id === winnerId ? '★ ' : ''}Auto ${i + 1}
                </span>
                <span style="margin-left:auto; color:#aaa; font-size:16px;">${p.laps} vueltas</span>
            </div>
        `).join('');
    }
    overlay.style.display = 'flex';
});

  function shadeColor(color, amount) {
    const num = parseInt(color.replace("#",""), 16);
    const r = Math.min(255, Math.max(0, (num >> 16) + amount));
    const g = Math.min(255, Math.max(0, ((num >> 8) & 0xFF) + amount));
    const b = Math.min(255, Math.max(0, (num & 0xFF) + amount));
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

// --- DIBUJO DE PISTA ---
function drawTrack() {
    const { cx, cy, gap, rx, ry, roadWidth, leftCX, rightCX, irx, iry } = TRACK;
    const kerbW = roadWidth + 28; // 178

    function drawLoop(lx, ly, lrx, lry, ccw) {
        ctx.beginPath();
        ctx.ellipse(lx, ly, lrx, lry, 0, 0, Math.PI * 2, ccw);
    }

    // --- PASTO CON RAYAS ---
    for (let i = 0; i < worldHeight; i += 40) {
        ctx.fillStyle = i % 80 === 0 ? "#1e3a1e" : "#1a3318";
        ctx.fillRect(0, i, worldWidth, 40);
    }

    // --- PIANO EXTERIOR (kerb) ---
    ctx.save();
    ctx.strokeStyle = "#cc0000";
    ctx.lineWidth = kerbW;
    drawLoop(leftCX,  cy, rx, ry, true);  ctx.stroke();
    drawLoop(rightCX, cy, rx, ry, false); ctx.stroke();
    ctx.setLineDash([28, 28]);
    ctx.strokeStyle = "#ffffff";
    drawLoop(leftCX,  cy, rx, ry, true);  ctx.stroke();
    drawLoop(rightCX, cy, rx, ry, false); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // --- ASFALTO ---
    ctx.save();
    ctx.strokeStyle = "#222222";
    ctx.lineWidth = roadWidth;
    drawLoop(leftCX,  cy, rx, ry, true);  ctx.stroke();
    drawLoop(rightCX, cy, rx, ry, false); ctx.stroke();
    ctx.restore();

    // --- PARCHE DE ASFALTO EN EL CRUCE ---
    ctx.save();
    ctx.fillStyle = "#222222";
    const crossW = roadWidth + gap + 30;
    const crossH = roadWidth + 10;
    ctx.fillRect(cx - crossW / 2, cy - crossH / 2, crossW, crossH);
    ctx.restore();

    // --- INTERIOR VERDE (islas) ---
    ctx.save();
    ctx.fillStyle = "#1e3a1e";
    ctx.beginPath(); ctx.ellipse(leftCX,  cy, irx, iry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(rightCX, cy, irx, iry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // --- PIANO INTERIOR ---
    const pianoW = 18;
    ctx.save();
    ctx.strokeStyle = "#cc0000";
    ctx.lineWidth = pianoW;
    drawLoop(leftCX,  cy, irx, iry, true);  ctx.stroke();
    drawLoop(rightCX, cy, irx, iry, false); ctx.stroke();
    ctx.setLineDash([18, 18]);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = pianoW;
    drawLoop(leftCX,  cy, irx, iry, true);  ctx.stroke();
    drawLoop(rightCX, cy, irx, iry, false); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // --- BORDE INTERIOR TENUE ---
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.12)";
    ctx.lineWidth = 1.5;
    drawLoop(leftCX,  cy, irx, iry, true);  ctx.stroke();
    drawLoop(rightCX, cy, irx, iry, false); ctx.stroke();
    ctx.restore();

    // --- BORDE EXTERIOR TENUE (línea central discontinua) ---
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.lineWidth = 2;
    ctx.setLineDash([18, 30]);
    drawLoop(leftCX,  cy, rx, ry, true);  ctx.stroke();
    drawLoop(rightCX, cy, rx, ry, false); ctx.stroke();
    ctx.restore();

    // --- LÍNEA DE META ---
    // Recta superior del óvalo derecho: (rightCX, cy - ry)
    const metaX = rightCX;
    const metaY = cy - ry; // 260
    const tileSize = 14; // proporcional a roadWidth=150 (era 12 para 110)
    const metaRows = Math.floor(roadWidth / tileSize);
    ctx.save();
    ctx.translate(metaX, metaY);
    ctx.rotate(Math.PI / 2);
    for (let c = 0; c < metaRows; c++) {
        for (let r = 0; r < 2; r++) {
            ctx.fillStyle = (c + r) % 2 === 0 ? "#ffffff" : "#000000";
            ctx.fillRect(-roadWidth / 2 + c * tileSize, -r * tileSize - tileSize, tileSize, tileSize);
        }	
    }
    ctx.restore();

    // --- CONO DERECHO EN EL CRUCE CENTRAL ---
    drawCone(cx + 110, cy);
    // --- CONO IZQUIERDO EN EL CRUCE CENTRAL ---
    drawCone(cx -110, cy);
    // --- CONO EXTREMO DERECHO ---
    // Posición relativa mantenida: mismo offset al borde exterior de la pista
    drawCone(cx + 720, cy);
    // --- CONO EXTREMO IZQUIERDO ---
    drawCone(cx - 720, cy);

    // --- NOMBRE ---
    ctx.save();
    ctx.font = "bold 20px 'Segoe UI', monospace";
    ctx.fillStyle = "rgba(255,255,255,0.08)";
    ctx.textAlign = "center";
    ctx.fillText("FIGURE-8 CIRCUIT", cx, cy + ry + 65);
    ctx.restore();
}

function drawCone(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "#ff6600";
    ctx.beginPath();
    ctx.moveTo(-8, 16); ctx.lineTo(8, 16); ctx.lineTo(0, -16);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.moveTo(-5, 6); ctx.lineTo(5, 6); ctx.lineTo(3, -2); ctx.lineTo(-3, -2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function drawGridMarks() {
    const { cx, cy, gap, rx, ry, roadWidth, rightCX } = TRACK;
    const metaY = cy - ry; // 260

    // Grilla sobre la recta superior del óvalo derecho
    const GRID_START_X = rightCX - 23;  // 1170
    const GRID_START_Y = metaY;          // 260
    const OFFSET_X     = 70;
    const OFFSET_Y_LANE = 50;
    const OFFSET_Y_ROW  = 16;
    const MAX_SLOTS = 8;

    ctx.save();
    ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
    ctx.lineWidth = 3;

    for (let i = 0; i < MAX_SLOTS; i++) {
        const row = Math.floor(i / 2);
        const col = i % 2;

        const x = GRID_START_X - row * OFFSET_X;
        const y = GRID_START_Y + (col - 0.5) * OFFSET_Y_LANE + row * OFFSET_Y_ROW;

        const wing = 22; // proporcional a roadWidth=150 (era 12)
        ctx.beginPath();
        ctx.moveTo(x , y - wing);
        ctx.lineTo(x, y + wing);
        ctx.moveTo(x - 22, y - wing);
        ctx.lineTo(x, y - wing);
        ctx.moveTo(x - 22, y + wing);
        ctx.lineTo(x, y + wing);
        ctx.stroke();

        ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
        ctx.font = "bold 15px Arial";
        ctx.textAlign = "center";
        ctx.fillText(i + 1, x - 30, y + 4);
    }
    ctx.restore();
}

function drawPlayer(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);

    // --- SOMBRA ---
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.ellipse(4, 3, 22, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    // --- DIFUSOR TRASERO ---
    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.moveTo(-22, -7); ctx.lineTo(-16, -9); ctx.lineTo(-16, 9); ctx.lineTo(-22, 7);
    ctx.closePath();
    ctx.fill();

    // --- RUEDAS TRASERAS ---
    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath(); ctx.ellipse(-10, -13, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-10,  13, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#444"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(-10, -13, 3, 2.5, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-10,  13, 3, 2.5, 0, 0, Math.PI * 2); ctx.stroke();

    // --- RUEDAS DELANTERAS ---
    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath(); ctx.ellipse(16, -12, 4, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(16,  12, 4, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#444"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(16, -12, 2.5, 2, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(16,  12, 2.5, 2, 0, 0, Math.PI * 2); ctx.stroke();

    // --- ALERÓN TRASERO ---
    ctx.fillStyle = p.color;
    ctx.fillRect(-21, -11, 10, 3);
    ctx.fillRect(-21,  8,  10, 3);
    ctx.fillStyle = "#222";
    ctx.fillRect(-20, -8, 2, 16);

    // --- CHASIS PRINCIPAL ---
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.moveTo(-18, -8);
    ctx.lineTo(10, -7);
    ctx.lineTo(24, -3);
    ctx.lineTo(28, 0);
    ctx.lineTo(24,  3);
    ctx.lineTo(10,  7);
    ctx.lineTo(-18,  8);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath();
    ctx.moveTo(-18, -4); ctx.lineTo(20, -3); ctx.lineTo(20, 3); ctx.lineTo(-18, 4);
    ctx.closePath();
    ctx.fill();

    // --- PONTONES ---
    ctx.fillStyle = shadeColor(p.color, -40);
    ctx.beginPath();
    ctx.moveTo(-5, -8); ctx.lineTo(14, -8); ctx.lineTo(14, -11); ctx.lineTo(-5, -11);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-5, 8); ctx.lineTo(14, 8); ctx.lineTo(14, 11); ctx.lineTo(-5, 11);
    ctx.closePath();
    ctx.fill();

    // --- COCKPIT ---
    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.ellipse(3, 0, 6, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(100,200,255,0.4)";
    ctx.beginPath();
    ctx.ellipse(5, 0, 4, 2.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // --- ALERÓN DELANTERO ---
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.moveTo(22, -5); ctx.lineTo(30, -8); ctx.lineTo(31, -6);
    ctx.lineTo(24, -3); ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(22, 5); ctx.lineTo(30, 8); ctx.lineTo(31, 6);
    ctx.lineTo(24, 3); ctx.closePath();
    ctx.fill();

    // --- HALO ---
    ctx.strokeStyle = shadeColor(p.color, -20);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(2, 0, 7, 4, 0, 0, Math.PI * 2);
    ctx.stroke();

    // --- TURBO GLOW ---
    if (p.isTurbo) {
        ctx.strokeStyle = "rgba(0,220,255,0.7)";
        ctx.lineWidth = 2;
        ctx.shadowColor = "cyan";
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(-18, -8); ctx.lineTo(10, -7); ctx.lineTo(28, 0);
        ctx.lineTo(10, 7); ctx.lineTo(-18, 8); ctx.closePath();
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgba(255,140,0,0.8)";
        ctx.beginPath();
        ctx.moveTo(-18, -3);
        ctx.lineTo(-26 - Math.random() * 8, 0);
        ctx.lineTo(-18, 3);
        ctx.closePath();
        ctx.fill();
    }

    ctx.restore();
}

function drawLeaderboard() {
    if (!gameState.players || gameState.players.length === 0) return;
    const sorted = [...gameState.players].sort((a, b) => (b.laps || 0) - (a.laps || 0));
    const x = 30, y = 80, rowHeight = 35, width = 220;

    ctx.save();
    ctx.fillStyle = "#e10600";
    ctx.fillRect(x, y, width, 30);
    ctx.fillStyle = "white";
    ctx.font = "bold 14px 'Segoe UI'";
    ctx.fillText("POS    DRIVER", x + 10, y + 20);
    ctx.textAlign = "right";
    ctx.fillText("LAPS", x + width - 10, y + 20);
    ctx.textAlign = "left";

    sorted.forEach((p, i) => {
        const rowY = y + 30 + (i * rowHeight);
        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(x, rowY, width, rowHeight - 2);
        ctx.fillStyle = p.color;
        ctx.fillRect(x, rowY, 5, rowHeight - 2);
        ctx.fillStyle = "white";
        ctx.font = "600 14px 'Segoe UI'";
        ctx.fillText(`${i + 1}`, x + 15, rowY + 22);
        ctx.fillStyle = "#ccc";
        ctx.font = "400 13px 'Segoe UI'";
        ctx.fillText(p.id.slice(0, 5).toUpperCase(), x + 45, rowY + 22);
        ctx.textAlign = "right";
        ctx.fillStyle = "white";
        ctx.fillText(`${p.laps || 0}`, x + width - 10, rowY + 22);
        ctx.textAlign = "left";
        if (p.isOnGrass) {
            ctx.fillStyle = "#ffcc00";
            ctx.beginPath();
            ctx.arc(x + width - 50, rowY + 18, 4, 0, Math.PI * 2);
            ctx.fill();
        }
    });
    ctx.restore();
}

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    const scale = Math.min(canvas.width / worldWidth, canvas.height / worldHeight);
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.scale(scale, scale);
    ctx.translate(-worldWidth / 2, -worldHeight / 2);

    drawTrack();
    drawGridMarks();

    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => { p.update(); p.draw(ctx); });

    if (gameState.players) {
        gameState.players.forEach(p => {
            if (p.isOnGrass && p.speed > 0.5) {
                for (let i = 0; i < 5; i++) {
                    const offsetX = -Math.cos(p.angle) * 20;
                    const offsetY = -Math.sin(p.angle) * 20;
                    particles.push(new Particle(
                        p.x + offsetX + (Math.random() - 0.5) * 10,
                        p.y + offsetY + (Math.random() - 0.5) * 10,
                        p.color, true
                    ));
                }
            }
            drawPlayer(p);
        });
    }
    ctx.restore();
    drawLeaderboard();
    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
</script>
</body>
</html>
