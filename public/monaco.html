    // 1. CLASE DE PARTÍCULAS
    class Particle {
        constructor(x, y, color, isOnGrass) {
            this.x = x;
            this.y = y;
            this.color = isOnGrass ? (Math.random() > 0.5 ? "#4b3621" : "#2d5a27") : "#555";
            this.vx = (Math.random() - 0.5) * 4;
            this.vy = (Math.random() - 0.5) * 4;
            this.life = 1.0;
            this.size = Math.random() * 4 + 2;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= 0.02;
        }
        draw(c) {
            c.globalAlpha = this.life;
            c.fillStyle = this.color;
            c.beginPath();
            c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            c.fill();
            c.globalAlpha = 1.0;
        }
    }

	function drawCone(x, y) {
    ctx.save();

    ctx.moveTo(-8, 16); ctx.lineTo(8, 16); ctx.lineTo(0, -16);

    ctx.beginPath();

    ctx.closePath();
    ctx.fill();
    ctx.restore();
}


	function drawGridMarks() {
    const GRID_START_X = 400;
    const GRID_START_Y = 55;
    const OFFSET_X = 100;
    const OFFSET_Y = 80;
    const MAX_SLOTS = 16; // Dibujamos marcas para 10 autos

    ctx.save();
    ctx.strokeStyle = "rgba(255, 255, 255, 0.5)"; // Blanco semi-transparente
    ctx.lineWidth = 3;

    for (let i = 0; i < MAX_SLOTS; i++) {
        const row = Math.floor(i / 2);
        const col = i % 2;
        
        const x = GRID_START_X + (row * OFFSET_X);
        const y = GRID_START_Y + (col * OFFSET_Y);

        // Dibujar el bracket "]" (orientado hacia la izquierda porque los autos miran hacia allá)
        // La trompa del auto encaja en la parte abierta del bracket
        const size = 30; // Largo de la marca
        const wing = 15; // Largo de las pestañas

        ctx.beginPath();
        // Línea vertical del bracket (atrás de la trompa)
        ctx.moveTo(x +15, y - wing); 
        ctx.lineTo(x +15, y + wing);
        
        // Pestaña superior
        ctx.moveTo(x + 35, y - wing);
        ctx.lineTo(x + 15, y - wing);
        
        // Pestaña inferior
        ctx.moveTo(x + 35, y + wing);
        ctx.lineTo(x + 15, y + wing);
        
        ctx.stroke();

        // Opcional: Número de posición tenue
        ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
        ctx.font = "bold 12px Arial";
        ctx.fillText(i + 1, x - 5 , y + 5);
    }
    ctx.restore();
}
function drawBuilding(x, y, width, height) {

    ctx.fillStyle = "#d6c3a5";
    ctx.fillRect(x, y, width, height);

    // Techo
    ctx.fillStyle = "#9b4938";
    ctx.fillRect(x, y, width, 8);

    // Ventanas
    ctx.fillStyle = "#3c6d7d";

    const columns = Math.floor(width / 18);
    const rows = Math.floor(height / 22);

    for (let col = 0; col < columns; col++) {
        for (let row = 0; row < rows; row++) {

            ctx.fillRect(
                x + 7 + col * 18,
                y + 15 + row * 22,
                8,
                11
            );
        }
    }
}

let oceanTime = 0;

function drawOcean() {

    ctx.fillStyle = "#176b82";
    ctx.fillRect(400, 650, 600, 400);

	

	
ctx.fillStyle = "#EECB5E";

    const colores = [
        "#2385a0",
        "#2c91ad",
        "#3aa0ba",
        "#5bb5c7",
        "#19748e"
    ];
	
    // Movimiento general de la marea
    const marea = Math.sin(oceanTime) * 50;

    for (let fila = 0; fila < 5; fila++) {

        const yBase = 701 + fila * 25;

        // Las filas más lejanas se mueven menos
        const movimiento = marea * (1 - fila * 0.08);

        for (let x = 440; x < 982; x += 30) {

            const y = yBase + movimiento;

            ctx.fillStyle = colores[fila % colores.length];

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                35,
                Math.PI,
                0
            );

            ctx.lineTo(x - 35, y);
            ctx.closePath();

            ctx.fill();
        }
    }
	
		
	
}

function drawHarbor(x, y, width) {

    ctx.fillRect(x, y, width, 35);

    // Borde
    ctx.strokeStyle = "#555";
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, width, 35);

    // Postes
    ctx.fillStyle = "#444";

    for (let px = x + 20; px < x + width; px += 40) {
        ctx.fillRect(px, y + 25, 5, 25);
    }

    // Amarras
    ctx.strokeStyle = "rgba(255,255,255,0.4)";
    ctx.lineWidth = 1;

    for (let px = x + 20; px < x + width; px += 40) {
        ctx.beginPath();
        ctx.moveTo(px, y + 30);
        ctx.lineTo(px + 20, y + 45);
        ctx.stroke();
    }
}

function drawPlayer(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);

    // --- SOMBRA ---
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.ellipse(4, 3, 22, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    // --- DIFUSOR TRASERO ---
    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.moveTo(-22, -7); ctx.lineTo(-16, -9); ctx.lineTo(-16, 9); ctx.lineTo(-22, 7);
    ctx.closePath();
    ctx.fill();

    // --- RUEDAS TRASERAS ---
    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath(); ctx.ellipse(-10, -13, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-10,  13, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
    // Aro
    ctx.strokeStyle = "#444"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(-10, -13, 3, 2.5, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-10,  13, 3, 2.5, 0, 0, Math.PI * 2); ctx.stroke();

    // --- RUEDAS DELANTERAS ---
    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath(); ctx.ellipse(16, -12, 4, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(16,  12, 4, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#444"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(16, -12, 2.5, 2, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(16,  12, 2.5, 2, 0, 0, Math.PI * 2); ctx.stroke();

    // --- ALERÓN TRASERO ---
    ctx.fillStyle = p.color;
    ctx.fillRect(-21, -11, 10, 3);
    ctx.fillRect(-21,  8,  10, 3);
    ctx.fillStyle = "#222";
    ctx.fillRect(-20, -8, 2, 16); // soporte central

    // --- CHASIS PRINCIPAL ---
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.moveTo(-18, -8);
    ctx.lineTo(10, -7);
    ctx.lineTo(24, -3);
    ctx.lineTo(28, 0);
    ctx.lineTo(24,  3);
    ctx.lineTo(10,  7);
    ctx.lineTo(-18,  8);
    ctx.closePath();
    ctx.fill();

    // Detalle lateral oscuro
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath();
    ctx.moveTo(-18, -4); ctx.lineTo(20, -3); ctx.lineTo(20, 3); ctx.lineTo(-18, 4);
    ctx.closePath();
    ctx.fill();

    // --- PONTONES (sidepods) ---
    ctx.fillStyle = shadeColor(p.color, -40);
    ctx.beginPath();
    ctx.moveTo(-5, -8); ctx.lineTo(14, -8); ctx.lineTo(14, -11); ctx.lineTo(-5, -11);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-5, 8); ctx.lineTo(14, 8); ctx.lineTo(14, 11); ctx.lineTo(-5, 11);
    ctx.closePath();
    ctx.fill();

    // --- COCKPIT ---
    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.ellipse(3, 0, 6, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();
    // Visor
    ctx.fillStyle = "rgba(100,200,255,0.4)";
    ctx.beginPath();
    ctx.ellipse(5, 0, 4, 2.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // --- ALERÓN DELANTERO ---
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.moveTo(22, -5); ctx.lineTo(30, -8); ctx.lineTo(31, -6);
    ctx.lineTo(24, -3); ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(22, 5); ctx.lineTo(30, 8); ctx.lineTo(31, 6);
    ctx.lineTo(24, 3); ctx.closePath();
    ctx.fill();

    // --- HALO ---
    ctx.strokeStyle = shadeColor(p.color, -20);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(2, 0, 7, 4, 0, 0, Math.PI * 2);
    ctx.stroke();

    // --- TURBO GLOW ---
    if (p.isTurbo) {
        ctx.strokeStyle = "rgba(0,220,255,0.7)";
        ctx.lineWidth = 2;
        ctx.shadowColor = "cyan";
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(-18, -8); ctx.lineTo(10, -7); ctx.lineTo(28, 0);
        ctx.lineTo(10, 7); ctx.lineTo(-18, 8); ctx.closePath();
        ctx.stroke();
        ctx.shadowBlur = 0;
        // Llama del escape
        ctx.fillStyle = "rgba(255,140,0,0.8)";
        ctx.beginPath();
        ctx.moveTo(-18, -3);
        ctx.lineTo(-26 - Math.random() * 8, 0);
        ctx.lineTo(-18, 3);
        ctx.closePath();
        ctx.fill();
    }
	

    ctx.restore();
}

// Helper: oscurecer/aclarar un color hex
function shadeColor(color, amount) {
    const num = parseInt(color.replace("#",""), 16);
    const r = Math.min(255, Math.max(0, (num >> 16) + amount));
    const g = Math.min(255, Math.max(0, ((num >> 8) & 0xFF) + amount));
    const b = Math.min(255, Math.max(0, (num & 0xFF) + amount));
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}


function drawLeaderboard() {
    if (!gameState.players || gameState.players.length === 0) return;
    
    // Ordenar por vueltas y luego por posición en pista (opcional)
    const sorted = [...gameState.players].sort((a, b) => (b.laps || 0) - (a.laps || 0));
    
    const x = 30;
    const y = 80;
    const rowHeight = 35;
    const width = 220;

    ctx.save();
    
    // Encabezado "TOWER"
    ctx.fillStyle = "#e10600"; // Rojo F1
    ctx.fillRect(x, y, width, 30);
    ctx.fillStyle = "white";
    ctx.font = "bold 14px 'Segoe UI'";
    ctx.fillText("POS    DRIVER", x + 10, y + 20);
    ctx.textAlign = "right";
    ctx.fillText("LAPS", x + width - 10, y + 20);
    ctx.textAlign = "left";

    sorted.forEach((p, i) => {
        const rowY = y + 30 + (i * rowHeight);
        
        // Fondo de fila (alternado para legibilidad)
        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(x, rowY, width, rowHeight - 2);

        // Barra de color del equipo/auto
        ctx.fillStyle = p.color;
        ctx.fillRect(x, rowY, 5, rowHeight - 2);

        // Texto de posición y Nombre (ID corto)
        ctx.fillStyle = "white";
        ctx.font = "600 14px 'Segoe UI'";
        ctx.fillText(`${i + 1}`, x + 15, rowY + 22);
        
        ctx.fillStyle = "#ccc";
        ctx.font = "400 13px 'Segoe UI'";
        ctx.fillText(p.id.slice(0, 5).toUpperCase(), x + 45, rowY + 22);

        // Vueltas
        ctx.textAlign = "right";
        ctx.fillStyle = "white";
        ctx.fillText(`${p.laps || 0}`, x + width - 10, rowY + 22);
        ctx.textAlign = "left";

        // Indicador si está en PITS o GRASS (pequeño punto)
        if (p.isOnGrass) {
            ctx.fillStyle = "#ffcc00";
            ctx.beginPath();
            ctx.arc(x + width - 50, rowY + 18, 4, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    ctx.restore();
}

    // 5. LOOP PRINCIPAL
// 5. LOOP PRINCIPAL
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        const scale = Math.min(canvas.width / worldWidth, canvas.height / worldHeight);
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.scale(scale, scale);
        ctx.translate(-worldWidth / 2, -worldHeight / 2);
		
				
        drawTrack();




		drawGridMarks();
		
        // Partículas: Filtrar y actualizar
        particles = particles.filter(p => p.life > 0);
        particles.forEach(p => { p.update(); p.draw(ctx); });

        // Jugadores y Generación de Partículas
        if (gameState.players) {
            gameState.players.forEach(p => {
                // Lógica de pasto: si está en el pasto y moviéndose
                if (p.isOnGrass && p.speed > 0.5) {
    for (let i = 0; i < 5; i++) {  // más partículas
        const offsetX = +Math.cos(p.angle) * 20;
        const offsetY = -Math.sin(p.angle) * 20;
        particles.push(new Particle(
            p.x + offsetX + (Math.random() - 0.5) * 10,
            p.y + offsetY + (Math.random() - 0.5) * 10,
            p.color,
            true  // ← isOnGrass = true para colores tierra/pasto
        ));
    }
}
                drawPlayer(p); // Dibujar al jugador después de las partículas
            });
        }
        
        ctx.restore();

        drawLeaderboard();
        requestAnimationFrame(draw);
    }

    // Iniciar
    requestAnimationFrame(draw);
</script>
